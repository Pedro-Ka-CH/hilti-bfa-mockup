<title>Bank fee analysis</title>
<style>
/* Visual language follows the cash-visibility dashboard, Modon theme. Theme variables can be overridden per overlay (brand.theme). */
:root{--paper:#ffffff;--ink:#212529;--mut:#6f6d66;--rule:#dedede;--acc:#212529;--acc2:#b2aa98;--sand:#b2aa98;--wash:#f4f2f0;--red:#b8321f;--amb:#b7791f;--grn:#3d6b4f;

/*__THEME__*/
*{box-sizing:border-box}html{background:var(--paper)}
body{margin:0;color:var(--ink);font:14px/1.5 var(--f);padding-bottom:60px}
h1{font-family:var(--fh);font-weight:var(--fhw)}b,strong{font-family:var(--fm);font-weight:var(--fmw)}
.hdr{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:56px}
.hl{display:flex;align-items:center;gap:16px;min-height:26px}
.logo{height:26px;display:block}
.wm{font:500 20px var(--fm);letter-spacing:.2em;text-transform:uppercase}
.prod{font:12px var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);border-left:1px solid var(--sand);padding-left:16px}
.wrap{max-width:var(--maxw,1120px);margin:0 auto;padding:0 28px}
a,.lnk{color:var(--acc);cursor:pointer;text-decoration:none;border-bottom:1px solid var(--acc2);background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit}
a:hover,.lnk:hover{border-color:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 28px;padding:14px 0 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px}
.brand{font:var(--fmw) 12px var(--fm);letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.demo{color:#8a6d00;border:1px solid #d9c27a;padding:1px 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.views{display:flex;gap:22px;margin-left:auto;align-self:flex-end;flex-wrap:wrap}
.views span{cursor:pointer;color:var(--mut);padding:0 0 12px;margin-bottom:-1px;border-bottom:2px solid transparent;white-space:nowrap}
.views span.on{color:var(--ink);border-color:var(--ink)}
.eyebrow{margin:30px 0 4px;color:var(--mut);font-size:12.5px}
.hero{font-size:44px;line-height:1.12;margin:0 0 10px;font-weight:var(--fhw);letter-spacing:-.01em}
.sub{color:#55534b;max-width:820px;font-size:15px;margin:0 0 6px}
h2{font:600 11.5px Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
section{padding:26px 0;border-top:1px solid var(--rule)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 30px;margin:16px 0 8px}
.stat .n1{font:30px/1.15 var(--fh);font-weight:var(--fhw)}.stat .l{font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.stat .s{font-size:12px;color:var(--mut)}
.sbar{display:grid;grid-template-columns:230px 1fr 110px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.sbar .trk{height:10px;background:var(--wash);display:block}.sbar .fill{display:block;height:10px;background:var(--acc)}
.sbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbar .v{text-align:right;font-variant-numeric:tabular-nums}
.att{display:grid;grid-template-columns:14px 1fr;gap:8px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--wash)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--amb)}
.dot.red{background:var(--red)}.dot.grn{background:var(--grn)}.dot.sand{background:var(--acc2)}.dot.grey{background:#c4c2bb}
.st{white-space:nowrap;font-size:12.5px}.st .dot{margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ink);cursor:pointer;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--wash);vertical-align:top}
.n{text-align:right;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.neg{color:var(--red)}
tr.tot td{border-top:1px solid var(--ink);font-family:var(--fm);font-weight:var(--fmw)}
.heat td.n{min-width:62px}
.ctl{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:0 0 14px;font-size:13px}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
select,input[type=text]{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:5px 2px;font:14px var(--f);color:var(--ink);outline:none;min-width:150px}
input[type=text]{width:240px}
.note{color:var(--mut);font-size:12.5px;max-width:820px}
.scroll{max-height:70vh;overflow:auto}
.scroll th{position:sticky;top:0;background:var(--paper);z-index:1}
.xl{display:flex;justify-content:flex-end;margin:0 0 6px;font-size:12px}
.wsel{display:flex;gap:10px;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.wsel span[data-w]{cursor:pointer;padding-bottom:1px;border-bottom:1px solid transparent}.wsel span.on{color:var(--ink);border-color:var(--ink)}
.stack{display:flex;height:10px;background:var(--wash)}.stack div{height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.brief{border-left:2px solid var(--acc2);padding:2px 0 2px 16px;margin:18px 0 0}.brief p{margin:4px 0;font-size:15px}
.brief .tag{display:block;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;font-size:13px;display:none;z-index:9;max-width:80vw}
@media(max-width:820px){.cols{grid-template-columns:1fr}.hero{font-size:32px}.stats{grid-template-columns:repeat(2,1fr)}.sbar{grid-template-columns:140px 1fr 90px}}
@media print{.views,.lnk.ask,.wsel,.xl{display:none}.hdr{position:static}}

 const v=r=>{const s=r.cells[i]?.innerText||'',x=s.replace(/[^0-9.\-]/g,'');return /^[\s\-–]*(CHF\s)?[\d,.\-]+\s*(k|m|%|×)?\s*$/.test(s)&&x?parseFloat(x)*(/k\s*$/.test(s)?1e3:/m\s*$/.test(s)?1e6:1):s};

 h+=`<section><h2>Fee-exempt and zero-priced lines</h2>${table([{h:'Bank',f:r=>esc(BL(r.k))},{h:'Exempt (flag)',f:r=>fmt(r.e),n:1},{h:'Zero / waived / free',f:r=>fmt(r.z),n:1},{h:'Exempt with a charge',f:r=>fmt(r.c),n:1}],Object.entries(t).map(([k,v])=>({k,...v})),'tex')}<p class="note">${esc(E.rule)}</p></section>`}
 if(F&&F.statement_rate_flags.length) h+=`<section><h2>Bank-file FX rates vs month-end (${F.statement_rate_flags.length})</h2><div class="scroll">${table([{h:'Kind',k:'kind'},{h:'Bank',f:r=>esc(BL(r.bank))},{h:'Account',k:'account'},{h:'Month',k:'period'},{h:'Pair',k:'pair'},{h:'File rate',f:r=>fmt(r.file_rate,6),n:1},{h:'Month-end',f:r=>fmt(r.month_end,6),n:1},{h:'Ratio',f:r=>fmt(r.ratio,3),n:1}],F.statement_rate_flags,'tfxf')}</div></section>`;
 if(HI&&HI.ignored_files&&HI.ignored_files.total) h+=`<section><h2>Files your importer ignored (${HI.ignored_files.total})</h2>${table([{h:'Reason',k:'k'},{h:'Files',k:'v',n:1}],Object.entries(HI.ignored_files.by_reason).map(([k,v])=>({k,v})),'tig')}</section>`;
 if(F) h+=`<p class="note">Month-end FX: ${esc(F.month_end_source||'–')} (${(F.month_end_months||[]).length} months). To switch to Integrity rates, replace config/fx_month_end.yaml in the home folder.</p>`;
 return h}

// ---------------------------------------------------------------- page width + Excel export (no external libraries)
const XL={};
function setWidth(w){document.documentElement.style.setProperty('--maxw',{std:'1120px',wide:'1600px',full:'100%'}[w]);
 document.querySelectorAll('#wsel span').forEach(b=>b.classList.toggle('on',b.dataset.w==w));try{localStorage.setItem('bfa_width',w)}catch(e){}}
const _strip=h=>{const s=String(h??'').replace(/<sup[^>]*>.*?<\/sup>/g,'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&').trim();return s};
const _num=s=>{if(typeof s=='number')return s;const t=String(s).trim();return /^-?[\d,]+(\.\d+)?$/.test(t)&&t!=''?parseFloat(t.replace(/,/g,'')):t};
const xlBtn=(id)=>`<div class="xl"><span class="lnk" onclick="dlx('${id}')" title="Download every row of this table as an Excel file">Download to Excel</span></div>`;
function regTable(id,name,head,rows){XL[id]={name,head,rows}}
function _crc(b){let c,t=_crc.t;if(!t){t=_crc.t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}
 let x=0xFFFFFFFF;for(let i=0;i<b.length;i++)x=t[(x^b[i])&0xFF]^(x>>>8);return (x^0xFFFFFFFF)>>>0}
function _zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
 for(const [name,txt] of files){const nb=enc.encode(name),db=enc.encode(txt),crc=_crc(db);
  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
  parts.push(lh,nb,db);
  cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
  off+=lh.length+nb.length+db.length}
 const clen=cen.reduce((a,p)=>a+p.length,0);
 const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(clen),...u32(off),...u16(0)]);
 return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function _col(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function _rows(R){if(R.head)return R;
 if(R.cols)return {head:R.cols.map(c=>_strip(c.h)),rows:R.rows.map(r=>R.cols.map(c=>c.k?r[c.k]:(c.n?_num(_strip(c.f(r))):_strip(c.f(r)))))};
 return {head:[...R.labs.map(l=>_strip(l.h)),...R.months,'Total'],rows:R.rows.map(r=>[...R.labs.map(l=>_strip(l.f(r))),...R.months.map(m=>r.months[m]??null),
   Math.round(100*R.months.reduce((a,m)=>a+(r.months[m]||0),0))/100])}}
function dlx(id){const R=XL[id];if(!R){toast('Nothing to export');return}
 const el=document.getElementById(id),h2=el&&el.closest&&el.closest('section')&&el.closest('section').querySelector('h2');
 const T={..._rows(R),name:R.name||(h2?_strip(h2.innerHTML).split('·')[0].trim():id)};
 const x=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
 const cell=(v,r,c,st)=>{const ref=_col(c)+r;if(v==null||v==='')return '';if(typeof v=='number'&&isFinite(v))return `<c r="${ref}"${st?' s="1"':''}><v>${v}</v></c>`;
  return `<c r="${ref}" t="inlineStr"${st?' s="1"':''}><is><t xml:space="preserve">${x(v)}</t></is></c>`};
 const B=S.brand||{};const meta=[`${(D.brand&&D.brand.client)||''} · ${T.name}`,`Billing data to ${S.period_to} · generated ${String(S.generated_at).replace('T',' ').slice(0,16)} · account numbers masked · AI-generated, pending human review`];
 let rows=meta.map((m,i)=>`<row r="${i+1}">${cell(m,i+1,0)}</row>`).join('');
 rows+=`<row r="4">${T.head.map((h,c)=>cell(_strip(h),4,c,1)).join('')}</row>`;
 rows+=T.rows.map((r,i)=>`<row r="${i+5}">${r.map((v,c)=>cell(v,i+5,c)).join('')}</row>`).join('');
 const widths=T.head.map((h,c)=>Math.min(60,Math.max(8,_strip(h).length+2,...T.rows.slice(0,200).map(r=>String(r[c]??'').length+2))));
 const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData><autoFilter ref="A4:${_col(T.head.length-1)}${T.rows.length+4}"/></worksheet>`;
 const sn=x(T.name.replace(/[\[\]\*\?\/\\:]/g,' ').slice(0,31));
 const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
  ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
  ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${sn}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${sn.replace(/'/g,"''")}'!$A$4:$${_col(T.head.length-1)}$${T.rows.length+4}</definedName></definedNames></workbook>`],
  ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
  ['xl/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
  ['xl/worksheets/sheet1.xml',sheet]];
 const a=document.createElement('a');a.href=URL.createObjectURL(_zip(files));a.download='AI_'+T.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.xlsx';document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(`Excel file with ${T.rows.length} rows downloaded`)}
